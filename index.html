<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Eternal Love ❤️</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d001a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Canvas Partikel Latar Belakang */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container Utama */
        .container {
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 1000px;
        }

        /* Header & Typing Text */
        .header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: #ff6b81;
            text-shadow: 0 0 15px rgba(255, 107, 129, 0.8), 0 0 30px rgba(255, 107, 129, 0.4);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1rem;
            color: #e0d0ff;
            font-weight: 300;
            letter-spacing: 1px;
            min-height: 28px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* Grid Kartu 3D Glassmorphism */
        .love-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            perspective: 1000px;
        }

        .love-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 30px 25px;
            width: 240px;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(233, 30, 99, 0.2);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease, background 0.3s;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .love-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .love-card:hover::before {
            left: 100%;
        }

        .love-card:hover {
            transform: translateY(-15px) rotateX(10deg) rotateY(-5deg) scale(1.05);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 45px rgba(255, 64, 129, 0.5), 0 0 20px rgba(255, 105, 180, 0.4);
            border-color: rgba(255, 107, 129, 0.6);
        }

        .heart-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px #ff4081);
            animation: pulse 1.8s infinite ease-in-out;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .card-sub {
            font-size: 0.85rem;
            color: #ffb3c1;
            margin-top: 5px;
        }

        /* Floating Music Button Control */
        .music-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.4);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.15) rotate(15deg);
            background: rgba(255, 64, 129, 0.4);
        }

        .music-btn span {
            font-size: 1.5rem;
        }

        /* Modal Pop-up Foto */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 0, 15, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 25px;
            max-width: 90%;
            max-height: 85vh;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 64, 129, 0.6);
            position: relative;
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-content img {
            width: 100%;
            max-width: 480px;
            max-height: 60vh;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 107, 129, 0.5);
        }

        .modal-caption {
            margin-top: 18px;
            font-size: 1.3rem;
            color: #ff8fa3;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 143, 163, 0.5);
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
        }

        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff4081;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.8);
            transition: transform 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close-btn:hover {
            transform: scale(1.2) rotate(90deg);
        }

        /* Keyframes */
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #ff4081); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 20px #ff7597); }
        }
    </style>
</head>
<body>

    <!-- Canvas Partikel Latar Belakang -->
    <canvas id="bgCanvas"></canvas>

    <!-- Audio Element (Auto Play beat.mp4) -->
    <video id="bgMusic" loop style="display:none;" playsinline>
        <source src="beat.mp4" type="video/mp4">
    </video>

    <!-- Tombol Musik Melayang -->
    <div class="music-btn" id="musicToggle" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="header">
            <h1>My World, My Love ❤️</h1>
            <p id="typingText"></p>
        </div>

        <!-- Cards -->
        <div class="love-container">
            <div class="love-card" onclick="openPhoto('j1.jpg', 'Pertama Kali Aku Jatuh Cinta ✨', event)">
                <span class="heart-icon">💖</span>
                <div class="card-title">Memory #1</div>
                <div class="card-sub">Klik untuk melihat 🌸</div>
            </div>

            <div class="love-card" onclick="openPhoto('j2.jpg', 'Senyuman Indah Favoritku 😊❤️', event)">
                <span class="heart-icon">💕</span>
                <div class="card-title">Memory #2</div>
                <div class="card-sub">Klik untuk melihat ✨</div>
            </div>

            <div class="love-card" onclick="openPhoto('j3.jpg', 'Selamanya Bersamamu 👩‍❤️‍👨', event)">
                <span class="heart-icon">💓</span>
                <div class="card-title">Memory #3</div>
                <div class="card-sub">Klik untuk melihat 🌹</div>
            </div>
        </div>
    </div>

    <!-- Pop-up Modal Foto -->
    <div class="modal" id="photoModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePhoto()">&times;</button>
            <img id="modalImg" src="" alt="Love Memory">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
        // --- 1. OTOMATIS PUTAR AUDIO DARI beat.mp4 ---
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        let isPlaying = false;

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                musicIcon.innerText = '🎶';
            }).catch(err => {
                console.log("Autoplay diblokir oleh browser, menunggu interaksi pengguna.");
            });
        }

        // Jalankan audio secepat mungkin saat halaman diklik pertama kali (kebijakan Autoplay Browser)
        document.body.addEventListener('click', () => {
            if (!isPlaying) {
                playAudio();
            }
        }, { once: true });

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                musicIcon.innerText = '🔇';
            } else {
                audio.play();
                isPlaying = true;
                musicIcon.innerText = '🎶';
            }
        }

        // --- 2. EFEK KETIK TEKS (TYPING EFFECT) ---
        const textToType = "Setiap detik bersamamu adalah momen terindah dalam hidupku... ✨";
        let typeIndex = 0;
        function typeWriter() {
            if (typeIndex < textToType.length) {
                document.getElementById("typingText").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, 70);
            }
        }
        window.onload = () => {
            typeWriter();
            playAudio();
        };

        // --- 3. MODAL FOTO + FIREWORKS HEART ---
        function openPhoto(src, caption, event) {
            const modal = document.getElementById('photoModal');
            const img = document.getElementById('modalImg');
            const cap = document.getElementById('modalCaption');

            img.src = src;
            cap.innerText = caption;
            modal.classList.add('show');

            // Ciptakan efek ledakan hati tepat di posisi klik mouse
            createHeartFireworks(event.clientX, event.clientY);
        }

        function closePhoto() {
            document.getElementById('photoModal').classList.remove('show');
        }

        window.onclick = function(e) {
            const modal = document.getElementById('photoModal');
            if (e.target == modal) {
                closePhoto();
            }
        }

        // --- 4. ANIMASI PARTIKEL & BINTANG KANVAS ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * -1.5 - 0.5;
                this.color = `rgba(255, ${Math.floor(Math.random() * 100 + 100)}, ${Math.floor(Math.random() * 150 + 100)}, ${Math.random() * 0.7 + 0.3})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 90 }, () => new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 5. EFEK FIREWORKS HATI SAAT DIKLIK ---
        function createHeartFireworks(x, y) {
            const hearts = ['💖', '❤️', '💕', '✨', '💗'];
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.position = 'fixed';
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '2000';
                heart.style.transition = 'all 1.2s cubic-bezier(0.25, 1, 0.5, 1)';
                
                document.body.appendChild(heart);

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 180 + 50;
                const targetX = x + Math.cos(angle) * distance;
                const targetY = y + Math.sin(angle) * distance;

                setTimeout(() => {
                    heart.style.left = targetX + 'px';
                    heart.style.top = targetY + 'px';
                    heart.style.opacity = '0';
                    heart.style.transform = `scale(${Math.random() * 1.5 + 0.5}) rotate(${Math.random() * 360}deg)`;
                }, 10);

                setTimeout(() => { heart.remove(); }, 1200);
            }
        }
    </script>
</body>
</html>
