<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story Book ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b001a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Canvas Partikel Meletus */
        #volcanoCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 1. STAGE AMPLOP SURAT CINTA */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: transform 0.5s ease, opacity 0.8s ease;
        }

        .envelope-wrapper:hover {
            transform: scale(1.08);
        }

        .envelope {
            width: 180px;
            height: 130px;
            background: linear-gradient(135deg, #ff4081, #ff7597);
            border-radius: 15px;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.8), 0 0 60px rgba(255, 117, 151, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .envelope::before {
            content: '💌';
            font-size: 4rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
            animation: pulseHeart 1.5s infinite;
        }

        .envelope-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ffb3c1;
            text-shadow: 0 0 10px #ff4081;
        }

        /* 2. STAGE BUKU CERITA (DESAIN 3D BOOK) */
        .book-stage {
            position: relative;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .book-stage.active {
            display: flex;
            opacity: 1;
        }

        .book-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #ff65a3;
            text-shadow: 0 0 15px #ff007f;
            margin-bottom: 20px;
        }

        /* BUKU INTERAKTIF */
        .book {
            width: 700px;
            height: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 105, 180, 0.5);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 0, 128, 0.4), inset 0 0 20px rgba(255, 0, 128, 0.2);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Tulang Tengah Buku */
        .book::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,105,180,0.8), rgba(255,0,128,0.2));
            box-shadow: 0 0 10px #ff007f;
            z-index: 12;
            transform: translateX(-50%);
        }

        /* Sisi Kiri (Foto) & Sisi Kanan (Teks) */
        .page-left, .page-right {
            width: 50%;
            height: 100%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .page-left img {
            width: 100%;
            height: 100%;
            max-height: 330px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 117, 151, 0.6);
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
        }

        .page-right {
            text-align: left;
            padding-left: 35px;
        }

        .page-number {
            font-size: 0.9rem;
            color: #ffb3c1;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .romantic-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            font-style: italic;
        }

        /* Tombol Navigasi Lembaran Buku */
        .book-nav {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .nav-btn {
            background: rgba(255, 64, 129, 0.2);
            border: 1px solid rgba(255, 64, 129, 0.6);
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.3);
        }

        .nav-btn:hover {
            background: rgba(255, 64, 129, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.8);
        }

        /* Responsive untuk HP */
        @media (max-width: 768px) {
            .book {
                width: 90vw;
                height: auto;
                flex-direction: column;
            }
            .book::after { display: none; }
            .page-left, .page-right { width: 100%; padding: 15px; }
            .page-right { text-align: center; padding-left: 15px; }
        }

        /* Tombol Musik */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 64, 129, 0.2);
            border: 1px solid rgba(255, 64, 129, 0.5);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <canvas id="volcanoCanvas"></canvas>

    <video id="bgMusic" loop style="display:none;" playsinline>
        <source src="beat.mp4" type="video/mp4">
    </video>

    <div class="music-btn" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span>
    </div>

    <div class="envelope-wrapper" id="envelopeWrapper" onclick="openSurat(event)">
        <div class="envelope"></div>
        <div class="envelope-text">Buka Surat Cinta ❤️</div>
    </div>

    <div class="book-stage" id="bookStage">
        <h1 class="book-title">Our Love Journey 📖✨</h1>

        <div class="book">
            <div class="page-left">
                <img id="bookPhoto" src="j1.jpg" alt="Memory Photo">
            </div>

            <div class="page-right">
                <div class="page-number" id="pageNumber">Halaman 1 dari 3</div>
                <div class="romantic-text" id="romanticText">
                    "Sejak awal kita bertemu, kamu selalu punya cara untuk membuat hariku terasa lebih indah dan hangat." ❤️
                </div>
            </div>
        </div>

        <div class="book-nav">
            <button class="nav-btn" onclick="prevPage()">⬅️ Lembar Sebelumnya</button>
            <button class="nav-btn" onclick="nextPage()">Lembar Selanjutnya ➡️</button>
        </div>
    </div>

    <script>
        // DATA LEMBARAN BUKU (FOTO + TULISAN ROMANTIS)
        const pages = [
            {
                photo: "j1.jpg",
                text: "Sejak awal kita bertemu, kamu selalu punya cara untuk membuat hariku terasa lebih indah dan hangat. Terima kasih sudah hadir dalam hidupku. ❤️"
            },
            {
                photo: "j2.jpg",
                text: "Senyumanmu adalah hal favoritku di dunia ini. Setiap kali melihatmu tersenyum, semua rasa lelahku seketika menghilang. 😊✨"
            },
            {
                photo: "j3.jpg",
                text: "Tidak peduli seberapa cepat waktu berlalu, harapanku selalu sama: ingin terus mengukir kenangan indah ini selamanya bersamamu. 👩‍❤️‍👨💖"
            }
        ];

        let currentPage = 0;

        function updateBookPage() {
            const photoEl = document.getElementById('bookPhoto');
            const textEl = document.getElementById('romanticText');
            const numEl = document.getElementById('pageNumber');

            // Efek transisi halus saat lembaran diganti
            photoEl.style.opacity = 0;
            textEl.style.opacity = 0;

            setTimeout(() => {
                photoEl.src = pages[currentPage].photo;
                textEl.innerText = `"${pages[currentPage].text}"`;
                numEl.innerText = `Halaman ${currentPage + 1} dari ${pages.length}`;

                photoEl.style.opacity = 1;
                textEl.style.opacity = 1;
            }, 300);
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                updateBookPage();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateBookPage();
            }
        }

        // MUSIK & SURAT
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('musicIcon').innerText = '🔇';
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('musicIcon').innerText = '🎶';
            }
        }

        function openSurat(e) {
            audio.play();
            isPlaying = true;

            const env = document.getElementById('envelopeWrapper');
            env.style.opacity = '0';
            env.style.transform = 'scale(0)';
            setTimeout(() => env.style.display = 'none', 500);

            // Trigger Gunung Meletus Partikel Pink
            triggerHeartVolcano(e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2);

            // Tampilkan Buku Kenangan
            setTimeout(() => {
                const bookStage = document.getElementById('bookStage');
                bookStage.classList.add('active');
            }, 1000);
        }

        // ANIMASI GUNUNG MELETUS (HEART VOLCANO)
        const canvas = document.getElementById('volcanoCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let volcanoParticles = [];

        class VolcanoParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = (Math.random() * Math.PI) + Math.PI; 
                const speed = Math.random() * 25 + 10;
                
                this.vx = Math.cos(angle) * (Math.random() * 15 - 7.5);
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.4;
                
                this.size = Math.random() * 25 + 15;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                
                const pinkShades = ['#ff007f', '#ff4081', '#ff7597', '#ffb3c1', '#ffffff'];
                this.color = pinkShades[Math.floor(Math.random() * pinkShades.length)];
            }

            update() {
                this.vx *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.font = `${this.size}px serif`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff007f';
                ctx.fillText('❤️', this.x, this.y);
                ctx.restore();
            }
        }

        function triggerHeartVolcano(originX, originY) {
            for (let i = 0; i < 180; i++) {
                volcanoParticles.push(new VolcanoParticle(originX, originY));
            }
        }

        function renderVolcano() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = volcanoParticles.length - 1; i >= 0; i--) {
                const p = volcanoParticles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    volcanoParticles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderVolcano);
        }
        renderVolcano();
    </script>
</body>
</html>
