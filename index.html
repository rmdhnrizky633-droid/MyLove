<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love Story ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d001a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Canvas Partikel Meletus */
        #volcanoCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 1. STAGE SURAT CINTA */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: transform 0.5s ease, opacity 0.8s ease;
        }

        .envelope-wrapper:hover {
            transform: scale(1.08);
        }

        .envelope {
            width: 180px;
            height: 130px;
            background: linear-gradient(135deg, #ff4081, #ff7597);
            border-radius: 15px;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.8), 0 0 60px rgba(255, 117, 151, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .envelope::before {
            content: '💌';
            font-size: 4rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
            animation: pulseHeart 1.5s infinite;
        }

        .envelope-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ffb3c1;
            text-shadow: 0 0 10px #ff4081;
        }

        /* 2. STAGE HOLOGRAM FOTO (TERSEMBUNYI DI AWAL) */
        .hologram-stage {
            position: relative;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hologram-stage.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: #ff65a3;
            text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            margin-bottom: 30px;
        }

        /* Container 3 Foto Berjejer Hologram */
        .hologram-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            perspective: 1000px;
        }

        .holo-card {
            width: 180px;
            height: 250px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255, 0, 128, 0.05);
            border: 2px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5), inset 0 0 15px rgba(255, 0, 128, 0.3);
            transition: all 0.4s ease;
            animation: holoFloat 3s infinite ease-in-out alternate;
        }

        .holo-card:nth-child(2) {
            animation-delay: 0.5s;
        }
        .holo-card:nth-child(3) {
            animation-delay: 1s;
        }

        .holo-card:hover {
            transform: translateY(-15px) scale(1.08) rotateY(10deg);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.9), 0 0 80px rgba(255, 0, 128, 0.6);
            border-color: #ff3399;
        }

        .holo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.2) contrast(1.1);
        }

        /* Garis Proyeksi Laser Hologram */
        .holo-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(255, 105, 180, 0.25) 50%,
                transparent 100%
            );
            animation: holoScan 2.5s infinite linear;
            pointer-events: none;
        }

        /* Tombol Musik */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 64, 129, 0.2);
            border: 1px solid rgba(255, 64, 129, 0.5);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }

        /* Keyframes */
        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes holoFloat {
            0% { transform: translateY(0px) rotateX(0deg); }
            100% { transform: translateY(-12px) rotateX(5deg); }
        }

        @keyframes holoScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>

    <canvas id="volcanoCanvas"></canvas>

    <video id="bgMusic" loop style="display:none;" playsinline>
        <source src="beat.mp4" type="video/mp4">
    </video>

    <div class="music-btn" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span>
    </div>

    <div class="envelope-wrapper" id="envelopeWrapper" onclick="openSurat(event)">
        <div class="envelope"></div>
        <div class="envelope-text">Buka Surat Cinta ❤️</div>
    </div>

    <div class="hologram-stage" id="hologramStage">
        <h1 class="title">My Infinite Love ❤️</h1>
        <div class="hologram-container">
            <div class="holo-card">
                <img src="j1.jpg" alt="Memory 1">
            </div>
            <div class="holo-card">
                <img src="j2.jpg" alt="Memory 2">
            </div>
            <div class="holo-card">
                <img src="j3.jpg" alt="Memory 3">
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('musicIcon').innerText = '🔇';
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('musicIcon').innerText = '🎶';
            }
        }

        // AKSI SAAT SURAT DIKLIK
        function openSurat(e) {
            // 1. Putar Musik
            audio.play();
            isPlaying = true;

            // 2. Sembunyikan Surat Cinta
            const env = document.getElementById('envelopeWrapper');
            env.style.opacity = '0';
            env.style.transform = 'scale(0)';
            setTimeout(() => env.style.display = 'none', 500);

            // 3. Efek Gunung Meletus Partikel Pink
            triggerHeartVolcano(e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2);

            // 4. Tampilkan 3 Foto Hologram setelah letusan puncak
            setTimeout(() => {
                const holo = document.getElementById('hologramStage');
                holo.classList.add('active');
            }, 1000);
        }

        // ANIMASI GUNUNG MELETUS (HEART VOLCANO)
        const canvas = document.getElementById('volcanoCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let volcanoParticles = [];

        class VolcanoParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Kecepatan meluncur ke atas tinggi ala meletus
                const angle = (Math.random() * Math.PI) + Math.PI; 
                const speed = Math.random() * 25 + 10;
                
                this.vx = Math.cos(angle) * (Math.random() * 15 - 7.5);
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.4;
                
                this.size = Math.random() * 25 + 15;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                
                const pinkShades = ['#ff007f', '#ff4081', '#ff7597', '#ffb3c1', '#ffffff'];
                this.color = pinkShades[Math.floor(Math.random() * pinkShades.length)];
            }

            update() {
                this.vx *= 0.98;
                this.vy += this.gravity; // Efek gravitasi jatuh balik
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.font = `${this.size}px serif`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff007f';
                ctx.fillText('❤️', this.x, this.y);
                ctx.restore();
            }
        }

        function triggerHeartVolcano(originX, originY) {
            // Semburan 180 partikel sekaligus
            for (let i = 0; i < 180; i++) {
                volcanoParticles.push(new VolcanoParticle(originX, originY));
            }
        }

        function renderVolcano() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = volcanoParticles.length - 1; i >= 0; i--) {
                const p = volcanoParticles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    volcanoParticles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderVolcano);
        }
        renderVolcano();
    </script>
</body>
</html>
