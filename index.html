<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ❤️</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000005;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Partikel Hati Glowing */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Container Foto & Teks di Tengah Hati */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none; /* Agar klik tetap menembus ke canvas */
        }

        /* Teks Judul Glowing */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: #4facfe;
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe, 0 0 40px #00f2fe;
            margin-bottom: 25px;
            animation: glowPulse 2s infinite alternate;
        }

        /* Bingkai Foto Berbentuk Hati & Slideshow Otomatis */
        .photo-frame {
            width: 200px;
            height: 200px;
            position: relative;
            /* Masking CSS agar Foto Terpotong Menjadi Bentuk Hati */
            clip-path: path('M 100,30 C 100,30 80,0 40,0 C 15,0 0,20 0,50 C 0,90 100,160 100,160 C 100,160 200,90 200,50 C 200,20 185,0 160,0 C 120,0 100,30 100,30 Z');
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
            margin-bottom: 20px;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            transform: scale(0.9);
        }

        .photo-frame img.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Caption Teks Otomatis */
        .caption {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.8);
            min-height: 30px;
        }

        /* Tombol Musik Melayang */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.4);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            color: #fff;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            transition: transform 0.3s;
        }

        .music-btn:hover {
            transform: scale(1.1);
        }

        @keyframes glowPulse {
            from {
                text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
            }
            to {
                text-shadow: 0 0 20px #00f2fe, 0 0 35px #00f2fe, 0 0 50px #4facfe;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas Partikel Hati -->
    <canvas id="heartCanvas"></canvas>

    <!-- Audio Autoplay beat.mp4 -->
    <video id="bgMusic" loop style="display:none;" playsinline>
        <source src="beat.mp4" type="video/mp4">
    </video>

    <!-- Tombol Kontrol Musik -->
    <div class="music-btn" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span>
    </div>

    <!-- Konten Foto & Teks -->
    <div class="content-container">
        <h1 class="title">I Love You</h1>

        <!-- Bingkai Foto Hati yang Berganti Otomatis -->
        <div class="photo-frame">
            <img src="j1.jpg" class="slide active" alt="Foto 1">
            <img src="j2.jpg" class="slide" alt="Foto 2">
            <img src="j3.jpg" class="slide" alt="Foto 3">
        </div>

        <div class="caption" id="captionText">Kamu adalah alasan tersenyumku ✨</div>
    </div>

    <script>
        // --- 1. SLIDESHOW FOTO OTOMATIS BERGANTI ---
        const slides = document.querySelectorAll('.slide');
        const captions = [
            "Kamu adalah alasan tersenyumku ✨",
            "Setiap detik bersamamu sangat berharga ❤️",
            "Selamanya menyayangimu 💖"
        ];
        const captionEl = document.getElementById('captionText');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            captionEl.innerText = captions[currentSlide];
        }

        // Foto berganti otomatis setiap 3.5 detik (3500ms)
        setInterval(nextSlide, 3500);

        // --- 2. AUTOPLAY MUSIK (beat.mp4) ---
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;

        function playMusic() {
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('musicIcon').innerText = '🎶';
            }).catch(() => {});
        }

        document.body.addEventListener('click', () => {
            if (!isPlaying) playMusic();
        }, { once: true });

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('musicIcon').innerText = '🔇';
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('musicIcon').innerText = '🎶';
            }
        }

        window.onload = () => { playMusic(); };

        // --- 3. ANIMASI PARTIKEL HATI GLOWING (SESUAI GAMBAR) ---
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Rumus Matematika Kurva Bentuk Hati
        function heartEquation(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        class HeartParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.t = Math.random() * Math.PI * 2;
                const pos = heartEquation(this.t);
                
                // Ukuran skala bentuk hati disesuaikan dengan layar
                const scale = Math.min(canvas.width, canvas.height) / 45;
                
                this.baseX = canvas.width / 2 + pos.x * scale;
                this.baseY = canvas.height / 2 + pos.y * scale - 20;

                // Efek tebal/tipis partikel di sekeliling bentuk hati
                this.x = this.baseX + (Math.random() - 0.5) * 30;
                this.y = this.baseY + (Math.random() - 0.5) * 30;

                this.size = Math.random() * 2.5 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                
                // Warna Biru Glowing Neon sesuai gambar contoh
                this.color = `rgba(0, ${Math.floor(Math.random() * 150 + 105)}, 254, ${Math.random() * 0.8 + 0.2})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Kembalikan partikel jika bergerak terlalu jauh dari jalur hati
                const dx = this.x - this.baseX;
                const dy = this.y - this.baseY;
                if (Math.sqrt(dx * dx + dy * dy) > 35) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f2fe';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Membuat 450 partikel untuk membentuk hati yang padat & indah
        const particles = Array.from({ length: 450 }, () => new HeartParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
